schema_version: "1.1"
name: teilegeschaeft-review-unordentlich
description: "Ein Monat fehlt, Ergebnisrechnung widerspricht im Juni."
tags: ["skill:teilegeschaeft-review", unordentlich]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit, Agent]
context:
  scaffold_script: scaffold.sh
graders:
  - name: skript
    type: tool_used
    tool: Bash
    input_match: "teile\\.py.*teilegeschaeft-review"
  - name: bericht
    type: file_exists
    path: 03_Berichte/*_teilegeschaeft-review.docx
  - name: umsatz-ohne-maerz
    type: regex
    pattern: "1\\.709\\.458"
  - name: maerz-fehlt
    type: regex
    pattern: "März 2026"
  - name: juni-abweichung
    type: regex
    pattern: 'Juni 2026|Juni[ -](?:passt|weicht|Differenz|Abweichung)|(?:Abweichung|Differenz|weicht)[^\n]{0,60}Juni'
  - name: ehrlich
    type: llm
    criteria: >-
      PASS if the answer is in German, says that March 2026 is missing and the totals cover 11 of 12 months, does not
      estimate or fill March, and reports that the parts export and the service P&L disagree for June 2026 with both
      values shown and neither averaged nor silently chosen. FAIL if it presents a 12-month total or an average.
