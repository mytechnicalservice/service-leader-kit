schema_version: "1.1"
name: skill-matrix-sauber
description: "Zwei Zellen mit Einzelwissen, nach Stunden sortiert."
tags: ["skill:skill-matrix", sauber]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit]
context:
  scaffold_script: scaffold.sh
graders:
  - name: skript
    type: tool_used
    tool: Bash
    input_match: "personal\\.py.*skill-matrix"
  - name: stunden-sued-retrofit
    type: regex
    pattern: "720"
  - name: stunden-west-reparatur
    type: regex
    pattern: "540"
  - name: hinweis
    type: regex
    pattern: "BetrVG"
  - name: datei
    type: file_exists
    path: "03_Berichte/*skill-matrix*.xlsx"
  - name: antwort
    type: llm
    criteria: >-
      PASS if the answer is in German, names Süd · MM-800 Retrofit · Retrofit (720 order hours) and West · MM-800
      Retrofit · Reparatur (540 order hours) as single-person knowledge with training need, in that order, and
      shows the works council hint. FAIL if it rates or names individual employees.
