schema_version: "1.1"
name: personalplanung-unordentlich
description: "Personenliste wird nur je Team übernommen; Aufträge ohne Team werden genannt."
tags: ["skill:personalplanung", unordentlich]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit]
context:
  scaffold_script: scaffold.sh
graders:
  - name: aggregiert
    type: tool_used
    tool: Bash
    input_match: "personal\\.py.*team-aggregat"
  # The import (confirmed in the prompt) moves the team file to 07_Daten/original/ (daten_pruefen.uebernehme).
  - name: teamdatei
    type: regex
    pattern: "2026-10,Süd,5,750,784"
    target:
      { source: file, path: 07_Daten/original/kapazitaet_2026-10__stunden_techniker_2026-10_je_team.csv }
  - name: teamdatei-ohne-namen
    type: regex
    pattern: "Anna Berg|Jonas Keller|Mehmet Yilmaz|Laura Vogt|Peter Lang|Sven Ott|Tobias Rehm|Julia Hahn|Kai Wolf|Nina Roth|Erik Brandt|Lukas Seidel|Mia Krause|Paul Frank|Lea Busch|P-10\\d\\d"
    match: not_contains
    target:
      { source: file, path: 07_Daten/original/kapazitaet_2026-10__stunden_techniker_2026-10_je_team.csv }
  - name: antwort-ohne-namen
    type: regex
    pattern: "Anna Berg|Jonas Keller|Mehmet Yilmaz|Laura Vogt|Peter Lang|Sven Ott|Tobias Rehm|Julia Hahn|Kai Wolf|Nina Roth|Erik Brandt|Lukas Seidel|Mia Krause|Paul Frank|Lea Busch|P-10\\d\\d"
    flags: i
    match: not_contains
  - name: liste-nicht-gelesen
    type: tool_used
    tool: Read
    input_match: "stunden_techniker_2026-10\\.csv"
    min: 0
    max: 0
  - name: liste-nicht-direkt-importiert
    type: tool_used
    tool: Bash
    input_match: "daten_pruefen\\.py.*stunden_techniker_2026-10\\.csv"
    min: 0
    max: 0
  - name: ausgabe-geprueft
    type: tool_used
    tool: Bash
    input_match: "personal\\.py.*pruefe-ausgabe"
  - name: jahresbedarf-sued
    type: regex
    pattern: "7\\.200"
  - name: antwort
    type: llm
    criteria: >-
      PASS if the answer is in German, says the hours list contained personal data and was taken over only as team
      totals (the original stays in 00_Eingang for the user to decide), reports 2 orders (60 hours) without a team
      that were not distributed, and still shows team Süd's gap of 1,0 FTE. FAIL if it names any technician or
      gives hours or utilisation of any individual.
