schema_version: "1.1"
name: lieferanten-entscheidung-sauber
description: "Zwei saubere Angebote, Freigabegrenze 10.000 EUR überschritten."
tags: ["skill:lieferanten-entscheidung", sauber]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit, Agent]
context:
  scaffold_script: scaffold.sh
graders:
  - name: skript
    type: tool_used
    tool: Bash
    input_match: "teile\\.py.*lieferanten-entscheidung"
  - name: abgelegt
    type: file_exists
    path: 04_Angebote/Einkauf/2026-09-30_angebot_kugeltec.eml
  - name: memo
    type: file_exists
    path: 04_Angebote/*lieferanten-entscheidung*.docx
  - name: vorgang
    type: regex
    pattern: "typ: \"entscheidung\"[\\s\\S]*verantwortlich: \"Max Mustermann[\\s\\S]*betrag_eur: 18400(\\.0)?\\s[\\s\\S]*entscheidung: null"
    target: { source: file, path: 01_Vorgaenge/offen/V-0001.md }
  - name: empfehlung-finanzen
    type: regex
    pattern: "· empfehlung · finanzen\\s+Empfehlung: (zustimmen mit Auflagen|zustimmen|ablehnen)"
    target: { source: file, path: 01_Vorgaenge/offen/V-0001.md }
  - name: punkte
    type: regex
    pattern: "94,7"
  - name: antwort
    type: llm
    criteria: >-
      PASS if the answer is in German, recommends Kugeltec GmbH with 94,7 vs 72,0 points as a recommendation (not a
      decision), says the weighting is the kit standard, mentions the finance review because 18.400 EUR exceeds the
      approval limit, names case V-0001 and the memo path, and leaves the decision to the user. FAIL if it claims a
      decision was made, a mail was sent, or the author agent itself wrote the recommendation.
