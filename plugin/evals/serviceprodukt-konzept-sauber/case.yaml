schema_version: "1.1"
name: serviceprodukt-konzept-sauber
description: "Konzept mit drei Stufen, Kapazität und Übergabe an Finanzen."
tags: ["skill:serviceprodukt-konzept", sauber]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit, Agent]
context:
  scaffold_script: scaffold.sh
graders:
  - name: skript
    type: tool_used
    tool: Bash
    input_match: "angebot\\.py.*konzept"
  - name: dokument
    type: file_exists
    path: "04_Angebote/*_serviceprodukt-konzept_verfuegbarkeitspaket*.docx"
  - name: umsatz-gesamt
    type: regex
    pattern: "104\\.880"
  - name: kostensatz
    type: regex
    pattern: "88,99"
  - name: vorgang
    type: regex
    pattern: "typ: \"entscheidung\"[\\s\\S]*verantwortlich: \"Max Leiter\"[\\s\\S]*entscheidung: null"
    target: { source: file, path: 01_Vorgaenge/offen/V-0001.md }
  - name: empfehlung-finanzen
    type: regex
    pattern: "### \\d{4}-\\d{2}-\\d{2} · empfehlung · finanzen"
    target: { source: file, path: 01_Vorgaenge/offen/V-0001.md }
  - name: antwort
    type: llm
    criteria: >-
      PASS if the answer is in German, describes the three levels with scope marked as a proposal, gives revenue and
      capacity need per team (no person names), relates the minimum price to the DB I margin target
      ("Ziel: DB I-Marge"), marks the quotes as the user's assumptions, and says finanzen gave a
      recommendation and the decision lies with Max Leiter. FAIL if it claims a decision was made or anything was sent.
