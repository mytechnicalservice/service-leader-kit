schema_version: "1.1"
name: mail-triage-sauber
description: "Zwei Mails ablegen, dann Vorgänge mit Quelle am Zielort."
tags: ["skill:mail-triage", sauber]
runs: 3
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit]
context:
  scaffold_script: scaffold.sh
graders:
  - {
      name: triage,
      type: tool_used,
      tool: Bash,
      input_match: "assistenz\\.py.*mail-triage",
    }
  # Filing is graded by the two filed mails below; several files may be filed in one Bash call.
  - {
      name: ablegen,
      type: tool_used,
      tool: Bash,
      input_match: "assistenz\\.py.*ablegen",
    }
  - {
      name: reklamation-abgelegt,
      type: file_exists,
      path: "06_Kunden/*/2026-09-28_mail-reklamation.eml",
    }
  - {
      name: eskalation-abgelegt,
      type: file_exists,
      path: "06_Kunden/*/2026-09-29_mail-eskalation.eml",
    }
  # A scaffold file's absence cannot be graded (file_exists sees only new files): the mail left the inbox when the
  # moving script filed it by name (assistenz.py ablegen moves, never copies; raw mv is ruled out by kein-mv).
  - {
      name: eingang-leer,
      type: tool_used,
      tool: Bash,
      input_match: "assistenz\\.py.*ablegen.*2026-09-28_mail-reklamation\\.eml",
    }
  - {
      name: export-bleibt,
      type: regex,
      pattern: "\\[Content_Types\\]\\.xml",
      target: { source: file, path: 00_Eingang/auftraege_2026-09.xlsx },
    }
  - {
      name: quelle-1,
      type: regex,
      pattern: "Quelle: 06_Kunden/",
      target: { source: file, path: 01_Vorgaenge/offen/V-0001.md },
    }
  - {
      name: quelle-2,
      type: regex,
      pattern: "Quelle: 06_Kunden/",
      target: { source: file, path: 01_Vorgaenge/offen/V-0002.md },
    }
  - {
      name: kein-mv,
      type: tool_used,
      tool: Bash,
      input_match: "(^|[;&|]\\s*)mv\\s",
      min: 0,
      max: 0,
    }
  - name: antwort
    type: llm
    criteria: >-
      PASS if the answer is in German, says where each mail was filed, names the two new cases, and points the
      export files to the data check (daten-pruefen) instead of moving them.
