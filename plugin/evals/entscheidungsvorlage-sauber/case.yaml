schema_version: "1.1"
name: entscheidungsvorlage-sauber
description: "Entscheidungsvorlage zur Kulanz V-0004 mit zwei Empfehlungen."
tags: ["skill:entscheidungsvorlage", sauber]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit, Agent]
context:
  scaffold_script: scaffold.sh
graders:
  - name: datei
    type: file_exists
    path: "04_Angebote/*entscheidungsvorlage*.docx"
  - name: datei-geprueft
    type: regex
    pattern: "DATEI-OK 04_Angebote/[^ \"]*entscheidungsvorlage[^ \"]*\\.docx 8\\.400"
    target: trace
  - name: fassung-im-vorgang
    type: regex
    pattern: "Entscheidungsvorlage: 04_Angebote/[^\\n]*entscheidungsvorlage[^\\n]*\\(sha256 [0-9a-f]{12}\\)"
    target: { source: file, path: 01_Vorgaenge/offen/V-0004.md }
  - name: nicht-entschieden
    type: regex
    pattern: "^entscheidung: null$"
    flags: m
    target: { source: file, path: 01_Vorgaenge/offen/V-0004.md }
  - name: kein-entscheide
    type: tool_used
    tool: Bash
    input_match: 'vorgang\.py(?:\\[n"]|[\s"\\])*entscheide\b'
    min: 0
    max: 0
  - name: antwort
    type: llm
    criteria: >-
      PASS if the answer is in German, names the memo file, repeats both recommendations (qualitaet-recht: zustimmen
      mit Auflagen, Kulanz 50 % = 4.200 EUR; finanzen: zustimmen) and tells the user how to decide. FAIL if it states
      a decision was made or adds a recommendation of its own.
