schema_version: "1.1"
name: vorgaenge-uebersicht-unordentlich
description: "Beschädigter Vorgang verhindert die Übersicht und wird gemeldet."
tags: ["skill:vorgaenge-uebersicht", unordentlich]
runs: 3
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit]
context:
  scaffold_script: scaffold.sh
graders:
  - name: keine-excel
    type: file_exists
    path: "01_Vorgaenge/Vorgaenge-Uebersicht*.xlsx"
    exists: false
  - name: kein-write-an-vorgaengen
    type: tool_used
    tool: Write
    input_match: "01_Vorgaenge"
    min: 0
    max: 0
  - name: antwort
    type: llm
    criteria: >-
      PASS if the answer is in German, names V-0003 as damaged and asks the user to fix it in VS Code. FAIL if it
      built an overview some other way or edited V-0003.
