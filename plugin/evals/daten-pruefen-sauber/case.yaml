schema_version: "1.1"
name: daten-pruefen-sauber
description: "Sauberer Auftragsexport wird geprüft und übernommen."
tags: ["skill:daten-pruefen", sauber]
runs: 3
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit]
context:
  scaffold_script: scaffold.sh
graders:
  - name: uebernommen
    type: tool_used
    tool: Bash
    input_match: "daten_pruefen\\.py.*--uebernehmen"
  - name: original-abgelegt
    type: file_exists
    path: 07_Daten/original/auftraege_2026-09__auftraege_2026-09.xlsx
  - name: summe
    type: regex
    pattern: "207\\.719"
  - name: antwort
    type: llm
    criteria: >-
      PASS if the answer is in German, names September 2026, 175 rows and the sum 207.719 (German number format), and
      says where the data was filed. FAIL if it states any number that is not in the script's output.
