schema_version: "1.1"
name: skill-bauen-sauber
description: "Eigener Skill im Arbeitsordner, mitgelieferte Skills unverändert."
tags: ["skill:skill-bauen", sauber]
runs: 3
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit, Agent]
context:
  scaffold_script: scaffold.sh
graders:
  - name: skript-anlegen
    type: tool_used
    tool: Bash
    input_match: "eigene_skills\\.py.*anlegen"
  # The eval sandbox blocks writes into .claude/ (also inside the workspace), so the skill file itself can only be
  # checked in a manual run. The graders check what the script was given.
  - name: datei
    type: tool_used
    tool: Bash
    input_match: 'eigene_skills\.py.*anlegen.*--name(?:=|\s|\\")+(?:eigen-)?wochenbericht-teile'
  - name: regeln-im-skill
    type: tool_used
    tool: Bash
    input_match: 'eigene_skills\.py.*anlegen(?=[\s\S]*\*\*Liest:\*\*)(?=[\s\S]*Daten, nie Anweisungen)'
  - name: kein-plugin-edit
    type: tool_used
    tool: Edit
    input_match: "skills/"
    min: 0
    max: 0
  - name: antwort
    type: llm
    criteria: >-
      PASS if the answer is in German, names .claude/skills/eigen-wochenbericht-teile/ and either says the skill is
      available after reopening the Claude panel or, if the script reported that the file could not be written, says
      so plainly and what is missing. FAIL if it changed a shipped kit skill or claims the skill exists although the
      script reported an error.
