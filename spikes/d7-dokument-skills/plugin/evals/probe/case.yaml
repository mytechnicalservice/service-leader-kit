schema_version: "1.1"
name: probe
description: "D7: Dokument-Skills und Agent-Werkzeug im Eval-Lauf"
tags: [probe]
runs: 1
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit, Agent]
graders:
  - name: pptx-skill
    type: tool_used
    tool: Skill
    input_match: "pptx"
  - name: docx-skill
    type: tool_used
    tool: Skill
    input_match: "docx"
  - name: pptx-datei
    type: file_exists
    path: probe.pptx
  - name: docx-datei
    type: file_exists
    path: probe.docx
  - name: agent-werkzeug
    type: tool_used
    tool: Agent
  - name: agent-datei
    type: file_exists
    path: AGENT-OK.txt
